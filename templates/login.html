{% extends "base.html" %}

{% block title %}
SmartSpend AI - Login
{% endblock %}


{% block content %}

<style>
    
    .card {
        border-radius: 20px !important;
        box-shadow: 0 20px 50px rgba(30, 41, 59, 0.15) !important;

        /* ⭐ Soft blue gradient matching the register page */
        background: linear-gradient(135deg, #f0f7ff 0%, #e6f0ff 100%);

        /* ⭐ Coloured top border matching your dashboard style */
        border-top: 5px solid #1877f2;
        border-left: 1px solid rgba(255, 255, 255, 0.6);
        border-right: 1px solid rgba(255, 255, 255, 0.6);
        border-bottom: 1px solid rgba(255, 255, 255, 0.6);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    
    .card h1 {
        color: #0b4a8e;
    }
</style>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">


                    

                    <div class="text-center mb-4">

                        <div style="font-size: 50px;">
                            🔐
                        </div>

                        <h1 class="mt-2 fw-bold">
                            Welcome Back
                        </h1>

                    </div>


                    

                    <form
                        method="POST"
                        action="{{ url_for('login', next=request.args.get('next')) }}"
                        id="loginForm"
                    >

                        <!-- 🛡️ CSRF TOKEN -->
                        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">


                        

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                <strong>Email Address</strong>
                            </label>

                            <input
                                type="email"
                                class="form-control form-control-lg"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>


                        

                        <div class="mb-3">

                            <label
                                for="loginPassword"
                                class="form-label"
                            >
                                <strong>Password</strong>
                            </label>


                            <div class="input-group">

                                <input
                                    type="password"
                                    class="form-control form-control-lg"
                                    id="loginPassword"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >


                                

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="toggleLoginPassword"
                                >
                                    👁️
                                </button>

                            </div>

                        </div>


                        
                        <button
                            type="submit"
                            class="btn btn-dark w-100 mt-3 py-2"
                        >
                            🔐 Login
                        </button>


                    </form>


                    

                    <div class="text-center mt-4">

                        <p class="mb-0">

                            Don't have an account?

                            <a
                                href="{{ url_for('register') }}"
                                class="fw-bold"
                            >
                                Create an account
                            </a>

                        </p>

                        <p class="mt-3 mb-0">
                            <a href="{{ url_for('register') }}" class="btn btn-outline-dark btn-sm">
                                Start Budgeting
                            </a>
                        </p>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>




<script>

document.addEventListener("DOMContentLoaded", function () {

    const passwordInput =
        document.getElementById("loginPassword");

    const toggleButton =
        document.getElementById("toggleLoginPassword");


    if (passwordInput && toggleButton) {

        toggleButton.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleButton.innerHTML =
                    "🙈";

            }

            else {

                passwordInput.type = "password";

                toggleButton.innerHTML =
                    "👁️";

            }

        });

    }

});

</script>


{% endblock %}
