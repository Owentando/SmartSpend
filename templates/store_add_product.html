{% extends "base.html" %}

{% block title %}
Add Product - Store Manager
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm p-4">

                <div class="d-flex align-items-center mb-4">
                    <span class="fs-2 me-2">🛍️</span>
                    <div>
                        <h1 class="fw-bold mb-0">Add New Product</h1>
                        <small class="text-muted">Add a new item to your catalogue</small>
                    </div>
                </div>

                <hr>

                <form method="POST" action="{{ url_for('store_add_product') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" name="name" placeholder="e.g., Sasko White Bread Loaf" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category" required>
                                <option value="">-- Select a category --</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.key }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Item Type</label>
                            <input type="text" class="form-control" name="item" placeholder="e.g., bread, rice, shoes">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Brand</label>
                            <input type="text" class="form-control" name="brand" placeholder="e.g., Sasko">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Size</label>
                            <input type="text" class="form-control" name="size" placeholder="e.g., 700g, 2L">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Store</label>
                            <input type="text" class="form-control" name="store" placeholder="e.g., Shoprite">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Price (R)</label>
                            <input type="number" step="0.01" class="form-control" name="price" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Shipping (R)</label>
                            <input type="number" step="0.01" class="form-control" name="shipping" value="0">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Distance (km)</label>
                            <input type="number" step="0.5" class="form-control" name="distance" value="5">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Rating</label>
                            <input type="number" step="0.1" class="form-control" name="rating" value="4.0" min="1" max="5">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Image URL (Optional)</label>
                            <input type="text" class="form-control" name="image_url" placeholder="/static/images/folder/file.jpg">
                            <small class="text-muted">Leave blank to auto-generate from the product name.</small>
                        </div>

                    </div>

                    <hr class="my-4">

                    <button type="submit" class="btn btn-success w-100 py-2">
                        ✅ Add Product
                    </button>

                    <a href="{{ url_for('store_dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">
                        ← Cancel
                    </a>

                </form>

            </div>

        </div>
    </div>

</div>

{% endblock %}
