{% extends "base.html" %}

{% block body_class %}bg-plain{% endblock %}

{% block title %}
Edit User - Admin
{% endblock %}

{% block content %}

<div class="container py-5">
    
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <div class="card shadow-sm p-4">
                <h1 class="fw-bold mb-4">✏️ Edit User</h1>
                
                <form method="POST" action="{{ url_for('admin_edit_user', user_id=user.id) }}">
                    
                    <!-- 🛡️ CSRF TOKEN -->
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Surname</label>
                        <input type="text" class="form-control" name="surname" value="{{ user.surname }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Budget (R)</label>
                        <input type="number" class="form-control" name="budget" value="{{ user.budget }}" step="0.01" min="0">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select class="form-select" name="role">
                            <option value="student" {% if user.role == 'student' %}selected{% endif %}>Student</option>
                            <option value="store_manager" {% if user.role == 'store_manager' %}selected{% endif %}>Store Manager</option>
                            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        💾 Save Changes
                    </button>
                    
                    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary w-100 mt-2">
                        ← Cancel
                    </a>
                    
                </form>
                
            </div>
            
        </div>
    </div>
</div>

{% endblock %}
