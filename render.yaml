services:
  - type: web
    name: smartspend
    runtime: python
    plan: starter            # persistent disks need a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INVITE_CODE
        sync: false           # Render will prompt you for this value
      - key: DATABASE_PATH
        value: /var/data/smartshop.db
    disk:
      name: smartspend-data
      mountPath: /var/data
      sizeGB: 1
